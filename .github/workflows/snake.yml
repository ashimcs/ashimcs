name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"   # regenerate every 6 hours
  workflow_dispatch: {}      # allow manual trigger from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate Nebula Pulse snake (dark)
        uses: Platane/snk@v3
        id: snake-dark
        with:
          github_user_name: ashimcs
          outputs: |
            dist/snake-dark.svg?color_snake=%237b2ff7&color_dots=2c1a4d,3a2160,5a2fa0,7b2ff7,ff2e92&color_gradient_step=0.25
            dist/snake-dark.gif?color_snake=%237b2ff7&color_dots=2c1a4d,3a2160,5a2fa0,7b2ff7,ff2e92&color_gradient_step=0.25

      - name: Generate Nebula Pulse snake (light)
        uses: Platane/snk@v3
        id: snake-light
        with:
          github_user_name: ashimcs
          outputs: |
            dist/snake-light.svg?color_snake=%23ff2e92&color_dots=eef0ff,c9c2ff,9d8cff,7b2ff7,00f0ff&color_gradient_step=0.25

      - name: Push generated files to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
