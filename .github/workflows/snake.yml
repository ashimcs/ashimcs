name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"   # regenerate every 6 hours
  workflow_dispatch: {}      # allow manual trigger from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Nebula Pulse snake (dark)
        uses: Platane/snk@v3
        with:
          github_user_name: ashimcs
          outputs: |
            assets/snake-dark.svg?color_snake=#00ff66&color_dots=#161b22,#1e3e20,#2e5f30,#3f8040,#47a042
            assets/snake-dark.gif?color_snake=#00ff66&color_dots=#161b22,#1e3e20,#2e5f30,#3f8040,#47a042
            assets/snake-light.svg?color_snake=#47a042&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/snake-dark.svg assets/snake-dark.gif assets/snake-light.svg
          if git commit -m "chore: regenerate contribution snake"; then git push; fi
